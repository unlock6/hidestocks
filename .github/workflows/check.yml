name: Check market memo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate quotes and symbols
        run: python ake_memo.py --self-test
      - name: Check native controls and symbol switching
        run: python ake_memo.py --smoke-test
